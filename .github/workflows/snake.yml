name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tree0327
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0066CC&color_dots=#f5f5f7,#cce0ff,#80b8ff,#4d9bff,#0066cc
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#0066CC&color_dots=#1d1d1f,#0a3b80,#0052a3,#0066CC,#4d9bff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
